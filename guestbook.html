    </div>
  </section>

  <!-- ================= 留言区 ================= -->
  <section class="section">
    <div class="container" style="max-width:820px">

      <div class="panel" style="margin-bottom:20px">
        <div class="panel-head">
          <h3>发表留言</h3>
          <span class="panel-sub">内容 1-500 字，请文明发言</span>
        </div>
        <div class="alert alert-success" id="gbPostOk" style="display:none"></div>
        <div class="alert alert-error" id="gbPostErr" style="display:none"></div>
        <textarea id="gbMsgText" rows="4" maxlength="500" placeholder="说点什么吧…（1-500 字）"></textarea>
        <div class="hero-cta" style="margin-top:12px">
          <button class="btn btn-primary" type="button" id="gbPostBtn">发表留言</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>全部留言</h3>
          <span class="panel-sub" id="gbMsgCount">共 0 条</span>
        </div>
        <div id="gbMsgList"><div class="gb-empty">正在加载留言…</div></div>
      </div>

    </div>
  </section>

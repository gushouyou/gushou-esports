<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线聊天 | 顾手游电竞</title>
<meta name="description" content="顾手游电竞在线聊天室：与客服和玩家实时交流，登录后可发言，每 5 秒自动刷新最新消息。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dynamic.css">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<header class="site-header">
  <div class="container nav-wrap">
    <a class="logo" href="index.html">
      <span class="logo-mark">顾</span>
      <span><span data-gb-text="brand.name">顾手游电竞</span><small data-gb-text="brand.short">GU ESPORTS</small></span>
    </a>

    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="services.html">服务项目</a>
      <a href="contact.html">联系下单</a>
      <a href="guestbook.html">留言板</a>
      <a href="chat.html" class="active">在线聊天</a>
          </nav>

    <div class="nav-actions">
      <a class="btn btn-ghost btn-sm" href="services.html">价目表</a>
      <a class="btn btn-primary btn-sm" href="contact.html">提交需求</a>
      <div id="userArea"></div>
    </div>

    <button class="nav-toggle" aria-label="菜单">☰</button>
  </div>
</header>

<main>

  <!-- ================= 页头 ================= -->
  <section class="page-head">
    <div class="container">
      <span class="eyebrow">LIVE CHAT</span>
      <h1>在线聊天</h1>
      <p>与客服和玩家实时交流，登录后即可发言，新消息每 5 秒自动刷新。</p>
    </div>
  </section>

  <!-- ================= 聊天区 ================= -->
  <section class="section">
    <div class="container" style="max-width:820px">
      <div class="panel">
        <div class="panel-head">
          <h3>聊天室</h3>
          <span class="panel-sub" id="gbChatStatus">连接中…</span>
        </div>

        <div class="gb-chat-box" id="gbChatBox">
          <div class="gb-empty">正在加载聊天记录…</div>
        </div>

        <div class="alert alert-error" id="gbChatErr" style="display:none"></div>

        <div class="gb-chat-input">
          <input type="text" id="gbChatText" maxlength="300" placeholder="说点什么…（1-300 字，登录后即可发言）">
          <button class="btn btn-primary" type="button" id="gbChatSend">发送</button>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ================= 页脚 ================= -->
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <a class="logo" href="index.html">
        <span class="logo-mark">顾</span>
        <span><span data-gb-text="brand.name">顾手游电竞</span><small data-gb-text="brand.short">GU ESPORTS</small></span>
      </a>
      <p class="footer-desc" data-gb-text="brand.footerDesc">专业游戏段位代练与陪玩服务平台，实名打手、进度可视、封号包赔。</p>
      <p class="footer-slogan" data-gb-text="brand.slogan">实名打手 · 进度可视 · 封号包赔</p>
    </div>

    <div>
      <h4>站内导航</h4>
      <div class="footer-links" data-gb-list="footer.nav" data-gb-tpl="footerNav"></div>
    </div>

    <div>
      <h4>热门服务</h4>
      <div class="footer-links" data-gb-list="footer.services" data-gb-tpl="footerPlain"></div>
    </div>

    <div>
      <h4>联系方式</h4>
      <div class="footer-links" data-gb-list="footer.contactLines" data-gb-tpl="footerPlain"></div>
    </div>
  </div>

  <div class="container footer-bottom">
    <span data-gb-text="footer.copyright">© 2026 顾手游电竞 · 本站为静态演示站点</span>
    <span data-gb-text="footer.tip">理性游戏 · 适度消费 · 未成年人禁止下单</span>
  </div>
</footer>

<button class="to-top" aria-label="返回顶部">↑</button>

<script src="assets/js/site-data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/api-client.js"></script>
<script src="assets/js/user-auth.js"></script>
<script src="assets/js/chat.js"></script>
</body>
</html>
